name: Problema no DanPlus
description: Relate um defeito do DanPlus sem divulgar dados privados.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Descreva o defeito do DanPlus. Não compartilhe senhas, tokens, chaves, links de fontes, endereços privados ou dados pessoais.
        Problemas do aplicativo upstream devem ser informados ao respectivo projeto de origem.
  - type: dropdown
    id: device
    attributes:
      label: Dispositivo
      options:
        - NVIDIA Shield / Android TV ARM64
        - Fire TV ARMv7
        - Outro Android TV / Google TV
        - Não sei
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão do DanPlus
      description: Consulte as informações do aplicativo.
      placeholder: Ex. 2.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir e comportamento observado
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
  - type: textarea
    id: evidence
    attributes:
      label: Capturas ou logs redigidos
      description: Remova dados privados antes de anexar.
