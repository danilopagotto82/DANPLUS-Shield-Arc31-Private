# Copy to local.properties and fill in the URL and public client key of a compatible Nuvio backend.
NUVIO_SUPABASE_URL=
NUVIO_SUPABASE_ANON_KEY=
NUVIO_SUPABASE_FALLBACK_URL=
# Enable only for a deployment that provides recommendations_v1.
DANPLUS_D12_SYNC_ENABLED=false
# For a custom backend, uncomment both approval URLs and point them to its portal.
# DEVICE_LOGIN_WEB_BASE_URL=https://your-backend.example/link
# TV_LOGIN_WEB_BASE_URL=https://your-backend.example/tv-login
AVATAR_PUBLIC_BASE_URL=
TRAKT_CLIENT_ID=
TRAKT_API_URL=https://api.trakt.tv/
TRAKT_REDIRECT_URI=urn:ietf:wg:oauth:2.0:oob
SIMKL_CLIENT_ID=
SIMKL_APP_NAME=nuvio
MDBLIST_CLIENT_ID=
WETRAKR_CLIENT_ID=
TMDB_API_KEY=
TVDB_API_KEY=
SCOUT_ENABLED=false
PARENTAL_GUIDE_API_URL=
INTRODB_API_URL=
TRAILER_API_URL=
IMDB_RATINGS_API_BASE_URL=
IMDB_TAPFRAME_API_BASE_URL=
# Optional: set to true only if you want to build the local ffmpeg-decoder-downmix module
USE_LOCAL_FFMPEG_DECODER=false
# Required only when USE_LOCAL_FFMPEG_DECODER=true
FFMPEG_SOURCE_DIR=path_to_ffmpeg_source_tree
FFMPEG_BUILD_DIR=path_to_ffmpeg_build_root
UNIQUE_CONTRIBUTIONS_BASE_URL=
SUPPORTERS_API_BASE_URL=https://nuvio.tv/
SUPPORT_URL=https://nuvio.tv/support
# Arc report relay. Leave blank to build without reports; never an official Nuvio address.
PLAYBACK_REPORTS_BASE_URL=
REPORTS_SIGNING_KEY=
PREMIUMIZE_CLIENT_ID=

# --- DV7 / libdovi (Dolby Vision Profile 7 to 8.1) ---

# Build the dovi_bridge native lib + load the runtime bridge.
DOVI_NATIVE_ENABLED=true

# Marks extractor hook integration as available in the current build.
DOVI_EXTRACTOR_HOOK_READY=true

# Link the prebuilt libdovi static archive into dovi_bridge.
DOVI_ENABLE_REAL_LINK=true
# Optional explicit overrides (otherwise resolved from the prebuilt root below):
# DOVI_LIBDOVI_STATIC_LIB=/path/to/libdovi.a
# DOVI_LIBDOVI_INCLUDE_DIR=/path/to/libdovi/include
DOVI_LIBDOVI_PREBUILT_ROOT=DV7/libdovi
